# Attached only when asked for: `sbx-init . --with figma`. The allowlist
# conventions -- including why an entry follows a recorded refusal rather than a
# guess -- are in kit/net/spec.yaml. This starts at the domain the service is
# obviously reached on; grow it from `sbx policy log` if that isn't enough.
schemaVersion: "2"
kind: mixin
name: net-figma
displayName: Figma network access
description: "Allows Figma, for sandboxes that need it"
permissions:
  network:
    allow:
      - "**.figma.com:443"
