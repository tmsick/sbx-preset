# Attached only when asked for: `sbx-init . --with asana`. The allowlist
# conventions -- including why an entry follows a recorded refusal rather than a
# guess -- are in kit/net/spec.yaml. This starts at the domain the service is
# obviously reached on; grow it from `sbx policy log` if that isn't enough.
schemaVersion: "2"
kind: mixin
name: net-asana
displayName: Asana network access
description: "Allows Asana, for sandboxes that need it"
permissions:
  network:
    allow:
      - "**.asana.com:443"
