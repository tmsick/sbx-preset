# syntax=docker/sandbox-kit:3
#
# Restores what Debian's maintainer scripts would have set up. Docker's
# `claude` workload (Debian 13 Hardened Image) has none of its packages'
# postinst steps applied: /var/lib/dpkg/info holds no .postinst, and no
# alternative is registered. Whatever such a step creates is missing, which
# tools then trip over on a terminal -- invisible to Claude Code's Bash tool,
# which has no tty. One hook per gap, each with the symptom it cures:
#
# - pager: no /usr/bin/pager, git's default pager, so `git log` on a tty fails
#   with "unable to execute pager 'pager'". Registered the way the less
#   package's postinst does, minus its man-page slave link. Registering the
#   alternative fixes every `pager` consumer, where `core.pager` would fix only
#   git and override $PAGER.
#
# Install hooks, not an overlay: alternatives live in /etc and /var/lib/dpkg,
# which the workload owns. The hooks run once when the sandbox is created,
# before the agent starts.
#
# Add a hook when a gap is observed, not speculatively, and drop each one once
# the workload ships its result. No ldconfig hook: the workload has shipped
# /etc/ld.so.cache since 2026-11-05 (VS Code Server's prerequisite check needs
# it), so an older sandbox is recreated, not patched by this kit.
#
# Declaration-only: no content, just an install hook.
schemaVersion: "3"
kind: mixin
displayName: Debian fixups
description: "Restores Debian post-install results missing from the claude workload (currently the pager alternative)"
sourceUrl: https://github.com/tmsick/sbx-preset

capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # Skipped without less rather than failing: a missing pager is no
        # reason to refuse the sandbox. Priority 77 is what the less package
        # registers.
        - command: |
            if [ -x /usr/bin/less ]; then
              update-alternatives --install /usr/bin/pager pager /usr/bin/less 77
            fi
          user: "0"
          description: Register less as the pager alternative
