# syntax=docker/sandbox-kit:3
#
# fish, with config.fish (locale, path, aliases) in the overlay. Other tools'
# fish integration ships with the kit that installs the tool (e.g. the mise
# kit's conf.d/mise.fish, the nvim kit's conf.d/nvim.fish), not here.
#
# Not the login shell: `ssh <host>` without a command runs the login shell,
# and VS Code Remote-SSH feeds that a POSIX script on stdin, which fish can't
# parse -- the connection times out. fish is registered in /etc/shells
# instead, which is where VS Code's terminal finds it for its
# `terminal.integrated.defaultProfile.linux` setting.
schemaVersion: "3"
kind: mixin
displayName: fish
description: "fish, registered in /etc/shells"
sourceUrl: https://github.com/tmsick/sbx-preset

# The fish release, declared once: handed to fish.dockerfile as FISH_VERSION
# and expanded into `provides` and `version`, so the kit can't claim a version
# it doesn't ship. Bumped by Renovate.
args:
  version:
    default: "4.9.3"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: fish release to install
    buildArg: FISH_VERSION

version: "${{ kit.args.version }}"
provides: ["fish@${{ kit.args.version }}"]

capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # The overlay can ship the fish binary but not an /etc/shells edit:
        # that file belongs to the workload.
        - command: |
            set -e
            grep -qx /usr/local/bin/fish /etc/shells 2>/dev/null || echo /usr/local/bin/fish >> /etc/shells
          user: "0"
          description: Register fish in /etc/shells
