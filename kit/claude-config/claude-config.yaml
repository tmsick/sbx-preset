# syntax=docker/sandbox-kit:3
#
# Injects Claude Code configuration (files/home/.claude/). CLAUDE.md stays
# either empty or generic enough for everyone to see.
#
# Named claude-config, not claude: each kit stages its sources at
# /usr/share/sandbox/kit/<descriptor stem>/, and the built-in claude workload
# already stages claude/.
#
# A file in the overlay rather than an agent-context capability: that one is
# the kit's guidance about itself, merged into one managed section with every
# other kit's, while ~/.claude/CLAUDE.md here is the user's own memory, and
# rules/ has no agent-context equivalent.
schemaVersion: "3"
kind: mixin
displayName: Claude Code config
description: "Injects CLAUDE.md (and rules/, if present) for Claude Code"
sourceUrl: https://github.com/tmsick/sbx-preset
# Staged rather than a bare `COPY --chown` onto scratch, which would hand the
# implicitly created /home to uid 1000 too: a mixin's directory entries
# replace the workload's, owner included.
build: |
  FROM busybox:stable AS build
  COPY files/home/ /out/home/agent/
  RUN chown -R 1000:1000 /out/home/agent && chown 0:0 /out /out/home

  FROM scratch
  COPY --from=build /out/ /
