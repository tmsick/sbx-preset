# syntax=docker/sandbox-kit:3
#
# Attached only when a project needs it:
# `--kit ghcr.io/tmsick/sbx-preset/kit/asana:latest`. Network allowlist
# conventions -- including why an entry follows a recorded refusal rather than
# a guess -- are in the README (## kit/). This starts at the domain the
# service is obviously reached on; grow it from `sbx policy log` if that isn't
# enough.
#
# Declaration-only: no content, just the runtime egress it grants.
schemaVersion: "3"
kind: mixin
displayName: Asana network access
description: "Allows Asana, for sandboxes that need it"
capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - "**.asana.com:443"
