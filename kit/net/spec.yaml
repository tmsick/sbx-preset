# Network allowlist applied at sandbox creation (`--kit`) or via `sbx kit add`.
# Rules from a kit are scoped to the sandbox it was applied to, unlike `sbx
# policy allow network` without --sandbox, which edits the global policy every
# sandbox on this host inherits; `sbx policy ls SANDBOX --source kit` shows the
# ones from here.
#
# Only what `sbx policy init balanced` doesn't already cover belongs here -- it
# ships ~190 allow entries (github, npm, pypi, crates.io, ubuntu, docker
# registries, the agent APIs, ...); check with `sbx policy ls --type network
# --decision allow --json` first.
#
# Grow the list from evidence, not guesses: an entry nobody has been blocked on
# is network reach handed to every agent for nothing. `sbx policy log [SANDBOX]`
# reports what the proxy actually refused, and the daemon log under
# ~/Library/Application Support/com.docker.sandboxes/ keeps those records once
# the log has rolled. context7 is here for that reason.
#
# Entries take an optional :PORT suffix; without one, every port is allowed, and
# `**.` covers the domain itself plus any depth of subdomain (`*.` is exactly one
# label and excludes the apex). Ports are matched separately, which is why github
# needs a line at all: `balanced` allows github.com:443, so HTTPS remotes work
# out of the box, but not port 22, and an SSH remote is refused without this.
#
# `tools/sbx-init allow DOMAIN` appends here, so keep the list one quoted entry
# per line, sorted -- that's the shape it rewrites.
schemaVersion: "2"
kind: mixin
name: net-default
displayName: Default network allowlist
description: "Allows the domains this setup routinely needs beyond the balanced policy"
permissions:
  network:
    allow:
      - "**.context7.com:443"
      - "github.com:22"
