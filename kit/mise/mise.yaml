# syntax=docker/sandbox-kit:3
#
# mise and its integration into every shell the sandbox runs: fish via
# conf.d/mise.fish (in the overlay), bash and Claude Code's Bash tool via the
# install hook below. A tool's shell integration belongs to the kit that
# installs the tool, so no other kit here needs to know mise exists. No tools
# are baked in; install them in the sandbox as a project needs them.
#
# Not Docker's docker.io/docker/sbx-kit-mise: it activates mise only in
# interactive bash (~/.bashrc), so the workload's own tools still win in
# Claude Code's Bash tool, and it has no fish integration.
schemaVersion: "3"
kind: mixin
displayName: mise
description: "mise, ahead of the workload's own tools in every shell"
sourceUrl: https://github.com/tmsick/sbx-preset

# The mise release, declared once: handed to mise.dockerfile as MISE_VERSION
# and expanded into `provides` and `version`, so the kit can't claim a version
# it doesn't ship. No leading `v`: a provide's version can't carry one; the
# Dockerfile adds it for the release URL. Bumped by Renovate.
args:
  version:
    default: "2026.11.1"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: mise release to install
    buildArg: MISE_VERSION

version: "${{ kit.args.version }}"
provides: ["mise@${{ kit.args.version }}"]
# conf.d/mise.fish takes effect when a fish kit is composed alongside, and is
# inert otherwise; the bash side works either way.
integrates: ["fish"]

capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # pnpm's standalone binary (and other Node.js SEA builds) needs
        # libatomic once mise installs one, and the workload lacks it
        # (https://github.com/pnpm/pnpm/issues/11531). A hook rather than
        # overlay content: apt needs the workload's own dpkg database. The
        # workload's apt sources (Debian, dhi.io) need no grant here.
        - command: |
            set -e
            apt-get update -y
            apt-get install -y --no-install-recommends libatomic1
            rm -rf /var/lib/apt/lists/*
          user: "0"
          env: [HTTP_PROXY, HTTPS_PROXY, http_proxy, https_proxy, NO_PROXY, no_proxy]
          description: Install libatomic1 for Node.js SEA builds

        # The overlay's ENV PATH is appended to the workload's, so the
        # workload's own python3, ... would shadow mise's shims. This file is
        # BASH_ENV and CLAUDE_ENV_FILE on Docker's workloads, and their
        # ~/.bashrc sources it: every bash, and every Claude Code Bash tool
        # call, gets the shims first. A hook rather than overlay content
        # because the file is the workload's -- an overlay would replace it,
        # not append to it.
        - command: |
            set -e
            f=/etc/sandbox-persistent.sh
            [ -f "$f" ] || exit 0
            grep -qF 'mise shims (sbx-preset mise kit)' "$f" && exit 0
            cat >> "$f" <<'EOF'
            # mise shims (sbx-preset mise kit): ahead of the workload's own tools.
            case "$PATH" in
              /home/agent/.local/share/mise/shims:*) ;;
              *) export PATH="/home/agent/.local/share/mise/shims:$PATH" ;;
            esac
            EOF
          user: "0"
          description: Put mise shims ahead of the workload's tools in sandbox-persistent.sh
