# Injects personal git config into a sandbox at creation (`--kit`) or via
# `sbx kit add`, so editing it takes effect on the next `sbx create`/`run`
# with no image rebuild.
#
# Targets files/home/.gitconfig and files/home/.gitignore_global, not the
# XDG-style ~/.config/git/{config,ignore}: sandboxd's own GitConfigCustomizer
# forces core.excludesFile to ~/.gitignore_global on every sandbox start
# (non-destructively merging into whatever this kit put there), so an
# XDG-style ignore file would just be shadowed and never read.
#
# files/home/.gitconfig and files/home/.gitignore_global are gitignored --
# see .gitignore -- and must exist locally before this kit is usable; only
# this spec.yaml is committed.
schemaVersion: "1"
kind: mixin
name: git-config
displayName: Personal git config
description: "Injects a personal ~/.gitconfig and ~/.gitignore_global"
