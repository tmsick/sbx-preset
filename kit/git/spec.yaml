# Injects git config at sandbox creation (`--kit`) or via `sbx kit add`.
#
# Targets files/home/.gitconfig and files/home/.gitignore_global, not the
# XDG-style ~/.config/git/{config,ignore}: sandboxd forces core.excludesFile to
# ~/.gitignore_global on every sandbox start, so an XDG-style ignore file would
# just be shadowed and never read (README has the full story).
#
# Identity (user.name/user.email) is sbx's own job (see README), so nothing
# here is personal.
schemaVersion: "2"
kind: mixin
name: git-config
displayName: git config
description: "Injects ~/.gitconfig and ~/.gitignore_global"
