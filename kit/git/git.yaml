# syntax=docker/sandbox-kit:3
#
# Injects git config.
#
# Targets files/home/.gitconfig and files/home/.gitignore_global, not the
# XDG-style ~/.config/git/{config,ignore}: sandboxd forces core.excludesFile to
# ~/.gitignore_global on every sandbox start, so an XDG-style ignore file would
# just be shadowed and never read (README has the full story).
#
# Identity (user.name/user.email) is sbx's own job (see README), so nothing
# here is personal.
schemaVersion: "3"
kind: mixin
displayName: git config
description: "Injects ~/.gitconfig and ~/.gitignore_global"
# Staged rather than a bare `COPY --chown` onto scratch, which would hand the
# implicitly created /home to uid 1000 too: a mixin's directory entries
# replace the workload's, owner included.
build: |
  FROM busybox:stable AS build
  COPY files/home/ /out/home/agent/
  RUN chown -R 1000:1000 /out/home/agent && chown 0:0 /out /out/home

  FROM scratch
  COPY --from=build /out/ /
