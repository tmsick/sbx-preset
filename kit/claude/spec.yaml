# Injects personal Claude Code configuration (files/home/.claude/) at sandbox
# creation (`--kit`) or via `sbx kit add`.
#
# Only this spec.yaml is committed; files/home/.claude/CLAUDE.md is gitignored
# and must exist locally before the kit is usable.
schemaVersion: "2"
kind: mixin
name: claude-config
displayName: Personal Claude Code config
description: "Injects a personal CLAUDE.md (and rules/, if present) for Claude Code"
