# Injects personal Claude Code configuration (files/home/.claude/) into a
# sandbox at creation (`--kit`) or via `sbx kit add`, so editing it takes
# effect on the next `sbx create`/`run` with no image rebuild.
#
# files/home/.claude/CLAUDE.md is gitignored -- see .gitignore -- and must
# exist locally before this kit is usable; only this spec.yaml is committed.
schemaVersion: "1"
kind: mixin
name: claude-config
displayName: Personal Claude Code config
description: "Injects a personal CLAUDE.md (and rules/, if present) for Claude Code"
