name: kits

on:
  pull_request:
    paths:
      - "kit/**"
      - ".github/workflows/kits.yml"
  push:
    branches: [main]
    paths:
      - "kit/**"
      - ".github/workflows/kits.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kit:
          - kit/mise
          - kit/fish
          - kit/nvim
          - kit/claude-config
          - kit/git
          - kit/context7
          - kit/asana
          - kit/atlassian
          - kit/figma
          - kit/playwright
          - kit/ca-trust
    steps:
      - uses: actions/checkout@v7

      - run: |
          curl -fsSL https://get.docker.com | sudo REPO_ONLY=1 sh
          sudo apt-get install -y docker-sbx

      # kit/ca-trust declares a required arg (the CA cert) that isn't
      # shipped with the kit -- validate needs a value for it, so a
      # throwaway self-signed cert stands in here. It's never used beyond
      # this check.
      - run: |
          set -euo pipefail
          args=()
          if [ "${{ matrix.kit }}" = "kit/ca-trust" ]; then
            openssl req -x509 -newkey rsa:2048 -days 1 -nodes \
              -keyout /tmp/ci-ca-key.pem -out /tmp/ci-ca.pem \
              -subj "/CN=CI placeholder CA" 2>/dev/null
            args+=(--kit-arg "cert_base64=$(base64 < /tmp/ci-ca.pem | tr -d '\n')")
          fi
          sbx kit validate "${{ matrix.kit }}" "${args[@]}"

  push:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kit:
          - kit/mise
          - kit/fish
          - kit/nvim
          - kit/claude-config
          - kit/git
          - kit/context7
          - kit/asana
          - kit/atlassian
          - kit/figma
          - kit/playwright
          - kit/ca-trust
    steps:
      - uses: actions/checkout@v7

      - run: |
          curl -fsSL https://get.docker.com | sudo REPO_ONLY=1 sh
          sudo apt-get install -y docker-sbx

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          set -euo pipefail
          ref="ghcr.io/tmsick/sbx-preset/${{ matrix.kit }}"
          sbx kit push "${{ matrix.kit }}" "$ref:latest"
          sbx kit push "${{ matrix.kit }}" "$ref:${{ github.sha }}"
