name: kits

on:
  pull_request:
    paths:
      - "kit/**"
      - ".github/workflows/kits.yml"
  push:
    branches: [main]
    paths:
      - "kit/**"
      - ".github/workflows/kits.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kit:
          - mise
          - fish
          - nvim
          - claude-config
          - git
          - context7
          - asana
          - atlassian
          - figma
          - playwright
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # Skipped on pull_request: push is false there, and a forked PR's
      # GITHUB_TOKEN has no packages:write to log in with anyway.
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The descriptor's `# syntax=docker/sandbox-kit:3` line selects the kit
      # frontend, which validates the descriptor as part of the build -- so a
      # pull request build is the validation step.
      - uses: docker/build-push-action@v7
        with:
          context: kit/${{ matrix.kit }}/
          file: kit/${{ matrix.kit }}/${{ matrix.kit }}.yaml
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/tmsick/sbx-preset/kit/${{ matrix.kit }}:latest
            ghcr.io/tmsick/sbx-preset/kit/${{ matrix.kit }}:${{ github.sha }}
          cache-from: type=gha,scope=kit-${{ matrix.kit }}
          cache-to: type=gha,mode=max,scope=kit-${{ matrix.kit }}
