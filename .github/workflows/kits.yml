name: kits

on:
  pull_request:
    paths:
      - "kit/**"
      - ".github/workflows/kits.yml"
  push:
    branches: [main]
    paths:
      - "kit/**"
      - ".github/workflows/kits.yml"
  workflow_dispatch:

permissions:
  contents: read

# Runs on one ref queue up instead of overlapping, and a queued run is replaced
# by a newer one: a stale run can't finish after a newer one and move `:latest`
# back.
concurrency:
  group: kits-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The descriptor's `# syntax=docker/sandbox-kit:3` line selects the kit
  # frontend, which validates the descriptor as part of the build -- so this
  # build is the validation step. (`sbx kit validate` can't stand in:
  # `--offline` can't load a v3 source kit, and without it validate needs
  # sandboxd.) Args without `buildArg:` -- kit/ca-trust's required CA
  # certificate, kit/playwright's release -- resolve at sandbox creation, so
  # the build needs no value for them.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kit:
          - mise
          - fish
          - nvim
          - claude-config
          - git
          - context7
          - asana
          - atlassian
          - figma
          - playwright
          - ca-trust
          - debian-fixups
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: kit/${{ matrix.kit }}/
          file: kit/${{ matrix.kit }}/${{ matrix.kit }}.yaml
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=kit-${{ matrix.kit }}
          cache-to: type=gha,mode=max,scope=kit-${{ matrix.kit }}

  # Only main publishes, whatever the trigger (workflow_dispatch included), and
  # only this job holds packages:write. Same build again, served from the
  # cache.
  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        kit:
          - mise
          - fish
          - nvim
          - claude-config
          - git
          - context7
          - asana
          - atlassian
          - figma
          - playwright
          - ca-trust
          - debian-fixups
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # mode=min: Buildx's default provenance can leave the image index
      # without the kit annotations (consumers fall back to the platform
      # manifest, but an explicit mode keeps them predictable).
      - uses: docker/build-push-action@v7
        with:
          context: kit/${{ matrix.kit }}/
          file: kit/${{ matrix.kit }}/${{ matrix.kit }}.yaml
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=min
          tags: |
            ghcr.io/tmsick/sbx-preset/kit/${{ matrix.kit }}:latest
            ghcr.io/tmsick/sbx-preset/kit/${{ matrix.kit }}:${{ github.sha }}
          cache-from: type=gha,scope=kit-${{ matrix.kit }}
          cache-to: type=gha,mode=max,scope=kit-${{ matrix.kit }}
