name: template

on:
  pull_request:
    paths:
      - "template/**"
      - ".github/workflows/template.yml"
  push:
    branches: [main]
    paths:
      - "template/**"
      - ".github/workflows/template.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [claude-code-docker, shell-docker]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Skipped on pull_request: push is false there, and a forked PR's
      # GITHUB_TOKEN has no packages:write to log in with anyway.
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: template/
          file: template/Dockerfile
          build-args: BASE_VARIANT=${{ matrix.variant }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/tmsick/sbx-preset/${{ matrix.variant }}:latest
            ghcr.io/tmsick/sbx-preset/${{ matrix.variant }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
