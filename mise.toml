# docker build the template image, as a local sanity check before pushing.
#
# sandboxd keeps its own image store, separate from the host Docker daemon, so
# this build is invisible to `sbx` -- there's no local path from here to a
# runnable sandbox. Push and let CI publish it, then pull from ghcr.io to try
# it (see README).
#
#   mise run build                          # docker build claude-code
#   BASE_VARIANT=shell mise run build       # the agent-less variant
#   MISE_VERSION=v2026.8.1 mise run build   # override the pin in the Dockerfile
#
# Variables are read from the environment, e.g. `FOO=bar mise run build` (see
# todo.md for a known bug with this in shells where mise is already
# activated). TAG defaults to BASE_VARIANT below; MISE_VERSION has no default
# here, so the Dockerfile's pin stays authoritative.

[env]
IMAGE = "{{ get_env(name='IMAGE', default='sbx-preset') }}"
BASE_VARIANT = "{{ get_env(name='BASE_VARIANT', default='claude-code') }}"
TAG = "{{ get_env(name='TAG', default=env.BASE_VARIANT) }}"

[tasks.build]
description = "docker build the template image"
run = '''
#!/usr/bin/env bash
set -euo pipefail
build_args=(--build-arg "BASE_VARIANT=$BASE_VARIANT")
if [ -n "${MISE_VERSION:-}" ]; then
  build_args+=(--build-arg "MISE_VERSION=$MISE_VERSION")
fi
docker build "${build_args[@]}" -f template/Dockerfile -t "$IMAGE:$TAG" template/
'''
